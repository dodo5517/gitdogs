<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="880" height="120">
  <!-- 앉아서 앞발을 핥는 다크 카라멜 골든 리트리버 (Lick) / 투명 배경 / SMIL 전용 -->
  <!-- 6px 격자, 걷기/앉기 모델과 어울리는 두상·몸통 비율 유지 -->
  <!-- 0.8초 주기 혀 낼름 + 고개 까딱 + 꼬리 살랑 / 중앙 고정 -->
  <!-- 팔레트: #D48C3D 골드 / #AA6323 다크골드 / #E8BB7D 애프리콧 / #24150D 눈코 / #E08796 혀 -->

  <g transform="translate(340 0)">
    <!-- 지면 그림자 (앉은 체형, 표준 크기) -->
    <ellipse cx="72" cy="70" rx="72" ry="4" fill="#000000" opacity="0.12"/>

    <!-- 앉은 뒷다리/엉덩이 (바닥에 넓게, 두툼) -->
    <rect x="30" y="42" width="18" height="24" fill="#AA6323"/> <!-- 접힌 뒷다리 -->
    <rect x="24" y="36" width="42" height="30" fill="#D48C3D"/> <!-- 엉덩이 볼륨 -->
    <rect x="24" y="60" width="48" height="6"  fill="#E8BB7D"/> <!-- 바닥 닿는 밝은 털 -->

    <!-- 살랑거리는 꼬리 (0.8초) -->
    <g>
      <g>
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.8s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="12" y="48" width="18" height="6" fill="#D48C3D"/>
        <rect x="6"  y="48" width="6"  height="6" fill="#E8BB7D"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.8s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="12" y="42" width="18" height="6" fill="#D48C3D"/>
        <rect x="6"  y="36" width="6"  height="6" fill="#E8BB7D"/>
      </g>
    </g>

    <!-- 세운 상체 (앉은 자세, 넓은 가슴) -->
    <g fill="#D48C3D">
      <rect x="54" y="18" width="30" height="6"/>  <!-- 등 상단 -->
      <rect x="54" y="24" width="36" height="6"/>
      <rect x="54" y="30" width="42" height="6"/>  <!-- 가슴 -->
      <rect x="60" y="36" width="42" height="6"/>
      <rect x="66" y="42" width="42" height="18"/> <!-- 깊은 가슴 -->
    </g>
    <g fill="#E8BB7D">
      <rect x="72" y="48" width="30" height="12"/> <!-- 앞가슴 밝은 털 -->
    </g>

    <!-- 목 + 앞가슴 앞면 (머리~가슴 연결, 두툼) -->
    <g fill="#D48C3D">
      <rect x="84" y="18" width="24" height="6"/>
      <rect x="90" y="24" width="24" height="6"/>
      <rect x="96" y="30" width="24" height="6"/>
      <rect x="102" y="36" width="18" height="6"/>
      <rect x="102" y="42" width="18" height="6"/>
    </g>
    <g fill="#E8BB7D">
      <rect x="108" y="30" width="12" height="6"/>
      <rect x="108" y="36" width="12" height="12"/>
      <rect x="108" y="48" width="12" height="6"/>
    </g>

    <!-- 바닥 지탱 앞다리 (배경) -->
    <rect x="96" y="54" width="12" height="12" fill="#AA6323"/>
    <rect x="96" y="60" width="18" height="6"  fill="#E8BB7D"/>

    <!-- 입으로 들어올린 전경 앞발 (핥는 리듬에 -2px 마중) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" keyTimes="0; 0.5; 1" dur="0.8s" calcMode="discrete" repeatCount="indefinite"/>
      <rect x="84" y="48" width="12" height="12" fill="#D48C3D"/> <!-- 들어올린 앞다리 -->
      <rect x="90" y="42" width="18" height="6"  fill="#D48C3D"/> <!-- 꺾인 발목 -->
      <rect x="102" y="36" width="18" height="6" fill="#E8BB7D"/> <!-- 얼굴 밑 발끝 -->
    </g>

    <!-- 머리 (발 향해 고개 숙임, 두상 큼직 / 0.8초 까딱) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 2; 0 0" keyTimes="0; 0.5; 1" dur="0.8s" calcMode="discrete" repeatCount="indefinite"/>
      <g fill="#D48C3D">
        <rect x="84" y="0"  width="30" height="6"/>  <!-- 정수리 -->
        <rect x="84" y="6"  width="30" height="6"/>
        <rect x="114" y="6" width="12" height="6"/>  <!-- 주둥이 윗부분 -->
        <rect x="84" y="12" width="24" height="6"/>  <!-- 뺨 -->
        <rect x="108" y="12" width="6" height="6"/>  <!-- 뺨~턱 메움 -->
      </g>
      <rect x="114" y="12" width="12" height="6" fill="#E8BB7D"/> <!-- 턱 -->
      <g fill="#24150D">
        <rect x="102" y="6" width="6" height="6"/>  <!-- 발 응시하는 눈 -->
        <rect x="126" y="6" width="6" height="6"/>  <!-- 코 -->
      </g>
      <!-- 낼름거리는 혀 (0.8초, 발끝으로) -->
      <g fill="#E08796">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.8s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="120" y="18" width="6" height="6"/> <!-- 발 향해 뻗은 혀 -->
        <rect x="114" y="18" width="6" height="6"/>
      </g>
      <rect x="84" y="6" width="12" height="18" fill="#AA6323"/>  <!-- 앞으로 쏠린 귀 -->
    </g>
  </g>
</svg>
