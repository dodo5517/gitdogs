<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="880" height="120">
  <!-- Fetch pixel dachshund with very long stick / transparent background / SMIL only -->
  <!-- 100% same character: colors, proportions, ground line -->
  <g transform="translate(46, 0)"> <!-- 캐릭터 배치 -->
    <!-- 지면 그림자 (기존과 동일) -->
    <ellipse cx="84" cy="70" rx="82" ry="4" fill="#000000" opacity="0.12"/>

    <!-- 전체 몸통 그룹: 신나서 위아래 바운스 애니메이션 -->
    <g id="g_body">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -2; 0 0" keyTimes="0;0.5;1" dur="0.36s"
        calcMode="discrete" repeatCount="indefinite"/>

      <!-- 프레임 A: 신장 (갤럽Extended, opacity 애니메이션) -->
      <g id="frame_a">
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1"
          dur="0.36s" calcMode="discrete" repeatCount="indefinite"/>
        
        <!-- 몸통/머리/꼬리 (신장 시) -->
        <!-- 긴 몸통 더 길게 연장: x=12, width=132 -->
        <rect x="12" y="30" width="132" height="24" fill="#A0672F"/>
        <rect x="24" y="48" width="108" height="6"  fill="#D9B285"/> <!-- 아랫배 연장 -->

        <!-- 머리 (기존 위치) -->
        <rect x="120" y="12" width="30" height="24" fill="#A0672F"/>
        <rect x="138" y="18" width="6"  height="6"  fill="#2E1F14"/> <!-- 눈 -->
        
        <!-- 날리는 귀 (진갈색) -->
        <rect x="114" y="18" width="18" height="18" fill="#6B4423"/>
        
        <!-- 아랫주둥이 -->
        <rect x="150" y="24" width="18" height="6" fill="#D9B285"/>

        <!-- 매우 긴 막대기 그룹 (샌드위치 구조로 물고 있는 형태 구현) -->
        <!-- 막대기는 아랫주둥이 뒤에, 윗주둥이 앞에 위치 -->
        <g id="g_stick_a">
          <!-- 막대기 픽셀 (나무색 2톤, x=66~246, y=24) -->
          <!-- 막대기의 왼쪽 끝(x=66)은 귀 영역(x=114)을 지나가도록 설정 -->
          <rect x="90" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="102" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="114" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="126" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="138" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="150" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="162" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="174" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="186" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="198" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="210" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
        </g>
        
        <!-- 윗주둥이 -->
        <rect x="150" y="18" width="12" height="6" fill="#A0672F"/>
        <rect x="162" y="18" width="6"  height="6" fill="#2E1F14"/> <!-- 코 -->

        <!-- 꼬리 (위로) -->
        <rect x="0"  y="6"  width="6" height="6" fill="#A0672F"/>
        <rect x="6"  y="12" width="6" height="6" fill="#A0672F"/>
        <rect x="12" y="24" width="6" height="6" fill="#A0672F"/>

        <!-- 다리 (신장 시 앞으로/뒤로 쭉 뻗음) -->
        <!-- 앞다리 (머리 쪽) -->
        <rect x="138" y="54" width="12" height="6" fill="#A0672F"/>
        <rect x="138" y="60" width="12" height="6" fill="#D9B285"/>
        <!-- 뒷다리 (꼬리 쪽) -->
        <rect x="0"   y="54" width="12" height="6" fill="#6B4423"/>
        <rect x="0"   y="60" width="12" height="6" fill="#D9B285"/>
      </g>

      <!-- 프레임 B: 수축 (갤럽Contracted, opacity 애니메이션) -->
      <g id="frame_b" opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1"
          dur="0.36s" calcMode="discrete" repeatCount="indefinite"/>
        
        <!-- 몸통/머리/꼬리 (수축 시) -->
        <!-- 등이 살짝 아치: y=24, height=30으로 몸통 상단 올림 -->
        <rect x="18" y="24" width="108" height="30" fill="#A0672F"/>
        <rect x="30" y="48" width="84"  height="6"  fill="#D9B285"/> <!-- 아랫배 모음 -->

        <!-- 머리 (미세하게 왼쪽 이동: x=114) -->
        <rect x="114" y="12" width="30" height="24" fill="#A0672F"/>
        <rect x="132" y="18" width="6"  height="6"  fill="#2E1F14"/> <!-- 눈 -->
        
        <!-- 날리는 귀 (진갈색) -->
        <rect x="108" y="18" width="18" height="18" fill="#6B4423"/>
        
        <!-- 아랫주둥이 (머리 이동에 맞춰 x=144) -->
        <rect x="144" y="24" width="18" height="6" fill="#D9B285"/>

        <!-- 매우 긴 막대기 그룹 (샌드위치 구조로 물고 있는 형태 구현, 머리 이동에 맞춰 x=-6) -->
        <g id="g_stick_b">
          <!-- 막대기 픽셀 (나무색 2톤, x=60~240, y=24) -->
          <!-- 막대기의 왼쪽 끝(x=60)은 귀 영역(x=108)을 지나가도록 설정 -->
          <rect x="84" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="96" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="108" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="120" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="132" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="144" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="156" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="168" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="180" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="192" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="204" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
        </g>
        
        <!-- 윗주둥이 (머리 이동에 맞춰 x=144) -->
        <rect x="144" y="18" width="12" height="6" fill="#A0672F"/>
        <rect x="156" y="18" width="6"  height="6" fill="#2E1F14"/> <!-- 코 -->

        <!-- 꼬리 (아래로) -->
        <rect x="6"  y="12" width="6" height="6" fill="#A0672F"/>
        <rect x="12" y="18" width="6" height="6" fill="#A0672F"/>
        <rect x="18" y="24" width="6" height="6" fill="#A0672F"/>

        <!-- 다리 (수축 시 몸 아래로 모음) -->
        <!-- 앞다리 (머리 쪽) -->
        <rect x="102" y="54" width="12" height="6" fill="#A0672F"/>
        <rect x="102" y="60" width="12" height="6" fill="#D9B285"/>
        <!-- 뒷다리 (꼬리 쪽) -->
        <rect x="36"  y="54" width="12" height="6" fill="#6B4423"/>
        <rect x="36"  y="60" width="12" height="6" fill="#D9B285"/>
      </g>
    </g> <!-- g_body end -->
  </g> <!-- 캐릭터 배치 g end -->
</svg>
