<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="100%" height="100%">
  <!-- 1. 플레이 바우 (Play Bow) -->
  <!-- 색상: 브라운 #A0672F, 진갈색 #6B4423, 탠 #D9B285, 눈/코 #2E1F14, 혀 #ED94A4 -->
  <g transform="translate(100, 46)">
    
    <!-- 바닥 그림자 (엎드릴 때 앞뒤로 매끄럽게 늘어남) -->
    <ellipse cx="84" cy="70" rx="82" ry="4" fill="#000000" opacity="0.12">
      <animate attributeName="rx" values="82; 82; 94; 94; 82; 82" keyTimes="0; 0.125; 0.15; 0.9; 0.925; 1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="84; 84; 96; 96; 84; 84" keyTimes="0; 0.125; 0.15; 0.9; 0.925; 1" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ========================================== -->
    <!-- 프레임 1: 평소 서 있는 자세 (0~0.5초, 3.7~4초) -->
    <!-- ========================================== -->
    <g>
      <animate attributeName="opacity" values="1;0;0;0;1;1" keyTimes="0; 0.125; 0.15; 0.9; 0.925; 1" dur="4s" calcMode="discrete" repeatCount="indefinite"/>
      
      <!-- 몸통 / 머리 / 다리 (베이스 100% 동일) -->
      <rect x="12" y="30" width="120" height="24" fill="#A0672F"/>
      <rect x="24" y="48" width="96" height="6" fill="#D9B285"/>
      <rect x="120" y="12" width="30" height="24" fill="#A0672F"/>
      <rect x="120" y="18" width="12" height="18" fill="#6B4423"/>
      <rect x="138" y="18" width="6" height="6" fill="#2E1F14"/>
      <rect x="150" y="18" width="12" height="6" fill="#A0672F"/>
      <rect x="150" y="24" width="18" height="6" fill="#D9B285"/>
      <rect x="162" y="18" width="6" height="6" fill="#2E1F14"/>
      
      <rect x="18" y="54" width="12" height="6" fill="#A0672F"/><rect x="18" y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="36" y="54" width="12" height="6" fill="#6B4423"/>
      <rect x="102" y="54" width="12" height="6" fill="#6B4423"/>
      <rect x="120" y="54" width="12" height="6" fill="#A0672F"/><rect x="120" y="60" width="12" height="6" fill="#D9B285"/>

      <!-- 평소 꼬리 -->
      <rect x="12" y="24" width="6" height="6" fill="#A0672F"/>
      <g>
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="0" y="12" width="6" height="6" fill="#A0672F"/><rect x="6" y="18" width="6" height="6" fill="#A0672F"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="0" y="6" width="6" height="6" fill="#A0672F"/><rect x="6" y="12" width="6" height="6" fill="#A0672F"/>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 프레임 2: 중간 트랜지션 (내려가는/올라가는 순간의 짧은 프레임) -->
    <!-- ========================================== -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;1;0;0" keyTimes="0; 0.125; 0.15; 0.9; 0.925; 1" dur="4s" calcMode="discrete" repeatCount="indefinite"/>
      
      <rect x="12" y="30" width="30" height="24" fill="#A0672F"/><rect x="24" y="48" width="18" height="6" fill="#D9B285"/>
      <rect x="42" y="36" width="48" height="24" fill="#A0672F"/><rect x="42" y="54" width="48" height="6" fill="#D9B285"/>
      <rect x="90" y="42" width="30" height="24" fill="#A0672F"/><rect x="90" y="60" width="30" height="6" fill="#D9B285"/>
      
      <rect x="120" y="18" width="30" height="24" fill="#A0672F"/>
      <rect x="120" y="24" width="12" height="18" fill="#6B4423"/>
      <rect x="138" y="24" width="6" height="6" fill="#2E1F14"/>
      <rect x="150" y="24" width="12" height="6" fill="#A0672F"/><rect x="150" y="30" width="18" height="6" fill="#D9B285"/>
      <rect x="162" y="24" width="6" height="6" fill="#2E1F14"/>
      
      <!-- 살짝 접힌 앞다리 -->
      <rect x="120" y="54" width="12" height="6" fill="#A0672F"/><rect x="126" y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="18" y="54" width="12" height="6" fill="#A0672F"/><rect x="18" y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="36" y="54" width="12" height="6" fill="#6B4423"/>
    </g>

    <!-- ========================================== -->
    <!-- 프레임 3: 플레이 바우 유지 (0.6초~3.6초) -->
    <!-- ========================================== -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0; 0.125; 0.15; 0.9; 0.925; 1" dur="4s" calcMode="discrete" repeatCount="indefinite"/>

      <!-- A그룹 (고정): 가슴, 앞다리, 머리 (절대 움직이지 않음) -->
      <g>
        <!-- 끊어짐 방지용 패치 -->
        <rect x="24" y="36" width="12" height="12" fill="#A0672F"/><rect x="24" y="48" width="12" height="6" fill="#D9B285"/>
        <!-- 경사로 내려가는 등허리 -->
        <rect x="36" y="36" width="24" height="18" fill="#A0672F"/><rect x="36" y="54" width="24" height="6" fill="#D9B285"/>
        <rect x="60" y="42" width="24" height="18" fill="#A0672F"/><rect x="60" y="60" width="24" height="6" fill="#D9B285"/>
        <rect x="84" y="42" width="30" height="18" fill="#A0672F"/><rect x="84" y="60" width="30" height="6" fill="#D9B285"/>
        
        <!-- 바닥으로 엎드린 앞다리 -->
        <rect x="120" y="54" width="24" height="6" fill="#6B4423"/><rect x="144" y="54" width="6" height="6" fill="#D9B285"/>
        <rect x="114" y="60" width="24" height="6" fill="#A0672F"/><rect x="138" y="60" width="12" height="6" fill="#D9B285"/>

        <!-- 정면을 올려다보는 머리와 헥헥거리는 입 -->
        <rect x="114" y="24" width="30" height="24" fill="#A0672F"/>
        <rect x="114" y="30" width="12" height="18" fill="#6B4423"/>
        <rect x="132" y="30" width="6" height="6" fill="#2E1F14"/>
        <rect x="144" y="30" width="12" height="6" fill="#A0672F"/>
        <rect x="156" y="30" width="6" height="6" fill="#2E1F14"/>
        
        <!-- 헥헥 (혀) -->
        <rect x="144" y="36" width="12" height="6" fill="#6B4423"/>
        <rect x="150" y="36" width="6" height="6" fill="#ED94A4"/>
        <rect x="144" y="42" width="18" height="6" fill="#D9B285"/>
      </g>

      <!-- B그룹 (씰룩임): 엉덩이, 뒷다리, 꼬리 -->
      <g>
        <!-- 생동감 넘치는 좌우 엉덩이 씰룩임 (±3px) -->
        <animateTransform attributeName="transform" type="translate" values="3,0; -3,0; 3,0" dur="0.25s" calcMode="discrete" repeatCount="indefinite"/>
        
        <rect x="12" y="30" width="24" height="18" fill="#A0672F"/><rect x="12" y="48" width="24" height="6" fill="#D9B285"/>
        <rect x="36" y="54" width="12" height="6" fill="#6B4423"/><rect x="36" y="60" width="12" height="6" fill="#6B4423"/>
        <rect x="18" y="54" width="12" height="6" fill="#A0672F"/><rect x="18" y="60" width="12" height="6" fill="#D9B285"/>
        
        <!-- 미친듯이 흔들리는 꼬리 잔상 -->
        <rect x="12" y="24" width="6" height="6" fill="#A0672F"/>
        <g>
          <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.1s" calcMode="discrete" repeatCount="indefinite"/>
          <rect x="0" y="12" width="6" height="6" fill="#A0672F"/><rect x="6" y="18" width="6" height="6" fill="#A0672F"/>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.1s" calcMode="discrete" repeatCount="indefinite"/>
          <rect x="0" y="18" width="6" height="6" fill="#A0672F"/><rect x="6" y="24" width="6" height="6" fill="#A0672F"/>
        </g>
      </g>
    </g>

  </g>
</svg>
