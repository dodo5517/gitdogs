<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="100%" height="100%">
  <!-- 2. 앉아서 발 핥기 / 중앙 고정 / 짧고 둥근 비율(베이스 모델 형태) -->
  <!-- 색상: 브라운 #A0672F, 진갈색 #6B4423, 탠 #D9B285, 눈/코 #2E1F14, 혀 #ED94A4 -->
  <g transform="translate(380, 20)">
    
    <!-- 바닥 그림자 -->
    <ellipse cx="48" cy="80" rx="45" ry="4" fill="#000000" opacity="0.12"/>

    <!-- ========================================== -->
    <!-- 뒤쪽에서 살랑거리는 꼬리 (0.6초 주기 토글) -->
    <!-- ========================================== -->
    <g>
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
      <rect x="-6" y="66" width="18" height="6" fill="#A0672F"/>
      <rect x="-12" y="60" width="6" height="6" fill="#A0672F"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
      <rect x="-6" y="66" width="18" height="6" fill="#A0672F"/>
      <rect x="-12" y="72" width="6" height="6" fill="#A0672F"/>
    </g>

    <!-- 먼 쪽 앞다리 (바닥 지지용) -->
    <rect x="60" y="66" width="6" height="6" fill="#6B4423"/>
    <rect x="60" y="72" width="6" height="6" fill="#A0672F"/>

    <!-- ========================================== -->
    <!-- 짜리몽땅하고 둥근 몸통 (베이스 모델 비율 적용) -->
    <!-- ========================================== -->
    <rect x="12" y="42" width="42" height="30" fill="#A0672F"/> <!-- 둥근 등과 엉덩이 -->
    <rect x="54" y="48" width="12" height="24" fill="#A0672F"/> <!-- 짧게 튀어나온 가슴 -->
    <rect x="18" y="72" width="48" height="6" fill="#D9B285"/>  <!-- 바닥에 깔린 배 (탠) -->

    <!-- 가까운 뒷다리 (바닥에 웅크림) -->
    <rect x="18" y="54" width="18" height="18" fill="#6B4423"/> <!-- 허벅지 -->
    <rect x="36" y="72" width="12" height="6" fill="#D9B285"/>  <!-- 뒷발 (탠) -->

    <!-- ========================================== -->
    <!-- 고개를 아래로 숙인 머리 -->
    <!-- ========================================== -->
    <!-- 머리 베이스 -->
    <rect x="42" y="18" width="30" height="24" fill="#A0672F"/>
    <!-- 축 늘어진 귀 -->
    <rect x="42" y="24" width="12" height="18" fill="#6B4423"/>
    <!-- 눈 -->
    <rect x="60" y="24" width="6" height="6" fill="#2E1F14"/>
    
    <!-- 발을 향해 뻗은 주둥이 -->
    <rect x="72" y="30" width="12" height="6" fill="#A0672F"/> <!-- 윗 주둥이 -->
    <rect x="84" y="30" width="6" height="6" fill="#2E1F14"/>  <!-- 코 -->
    <rect x="72" y="36" width="18" height="6" fill="#D9B285"/>  <!-- 아랫 주둥이 (탠) -->

    <!-- ========================================== -->
    <!-- 들고 있는 앞발과 날름거리는 혀 (1초 주기) -->
    <!-- ========================================== -->
    <g>
      <!-- 혀를 핥을 때 앞발이 2px 위아래로 까딱거림 -->
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" keyTimes="0;0.5;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
      
      <rect x="54" y="48" width="18" height="6" fill="#A0672F"/> <!-- 짧은 앞다리 팔 -->
      <rect x="72" y="42" width="12" height="6" fill="#D9B285"/> <!-- 위로 꺾어 든 앞발 -->

      <!-- 코(y=30) 아래, 앞발(y=42) 사이에 나타나는 분홍색 혀 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="84" y="42" width="6" height="6" fill="#ED94A4"/>
      </g>
    </g>

  </g>
</svg>
