<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="880" height="120">
<defs>
<g id="part_walk">
<g transform="translate(-18,44)">

  <!-- 화면을 가로지르며 총총 걷는 비숑 프리제 / 투명 배경 / SMIL 전용 -->
  <!-- 6px 격자 기반: 모든 rect 좌표와 크기는 6의 배수, 발바닥 y=66 기준으로 그림 -->
  <!-- 0.6초 주기 들썩임, 대각선 2프레임 걸음, 말린 꼬리 살랑 -->
  <!-- 팔레트: 화이트 #F7F1E8 / 음영 #DCCFBC / 비스킷 귀 #E8D2AE / 눈코 #2B211D / 혀 #E8899A / 볼터치 #F4B9B2 -->

  <g transform="translate(0, 6)">
    <!-- 화면을 가로지르는 이동 (합성 시 제거됨) -->
    <g>
      
      <ellipse cx="84" cy="70" rx="66" ry="4" fill="#000000" opacity="0.12"/>
      <!-- 몸통 그룹: 걸음에 맞춰 들썩임 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 2; 0 0" keyTimes="0; 0.5; 1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="42" y="24" width="54" height="6" fill="#F7F1E8"/> <!-- 둥근 등선 -->
        <rect x="36" y="30" width="66" height="12" fill="#F7F1E8"/> <!-- 포동포동한 몸통 -->
        <rect x="42" y="42" width="54" height="6" fill="#DCCFBC"/> <!-- 배 아래 솜털 음영 -->
        <rect x="102" y="36" width="6" height="12" fill="#F7F1E8"/> <!-- 앞가슴 솜털 -->
        <!-- 꼬리 프레임 1 -->
        <g>
          <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
          <rect x="30" y="6" width="18" height="6" fill="#F7F1E8"/> <!-- 몽글몽글 말린 깃털 꼬리 -->
          <rect x="24" y="12" width="24" height="6" fill="#F7F1E8"/>
          <rect x="30" y="18" width="12" height="6" fill="#DCCFBC"/>
          <rect x="42" y="18" width="6" height="6" fill="#F7F1E8"/>
        </g>
        <!-- 꼬리 프레임 2 -->
        <g opacity="0">
          <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
          <rect x="24" y="12" width="18" height="6" fill="#F7F1E8"/> <!-- 몽글몽글 말린 깃털 꼬리 -->
          <rect x="18" y="18" width="24" height="6" fill="#F7F1E8"/>
          <rect x="24" y="24" width="12" height="6" fill="#DCCFBC"/>
          <rect x="36" y="24" width="6" height="6" fill="#F7F1E8"/>
        </g>
        <rect x="102" y="-6" width="24" height="6" fill="#F7F1E8"/> <!-- 정수리 솜뭉치 -->
        <rect x="96" y="0" width="36" height="6" fill="#F7F1E8"/>
        <rect x="90" y="6" width="48" height="24" fill="#F7F1E8"/> <!-- 동그란 솜사탕 두상 -->
        <rect x="90" y="12" width="6" height="18" fill="#DCCFBC"/> <!-- 뒤통수 음영 (몸통과 구분) -->
        <rect x="96" y="30" width="36" height="6" fill="#DCCFBC"/> <!-- 턱 아래 솜털 음영 -->
        <rect x="138" y="12" width="12" height="12" fill="#F7F1E8"/> <!-- 짧고 보송한 주둥이 -->
        <rect x="138" y="24" width="6" height="6" fill="#F7F1E8"/> <!-- 수염 솜털 -->
        <rect x="144" y="12" width="6" height="6" fill="#2B211D"/> <!-- 까만 코 -->
        <rect x="126" y="12" width="6" height="6" fill="#2B211D"/> <!-- 동그란 눈 -->
        <rect x="126" y="24" width="6" height="6" fill="#F4B9B2"/> <!-- 볼터치 -->
        <rect x="138" y="24" width="6" height="6" fill="#E8899A"/> <!-- 내민 혀 -->
        <rect x="96" y="12" width="12" height="18" fill="#E8D2AE"/> <!-- 솜털에 반쯤 묻힌 처진 귀 -->
        <rect x="102" y="30" width="6" height="6" fill="#E8D2AE"/>
      </g>
      <!-- 걸음 프레임 A: 앞(전경)·뒤(배경) 딛기 -->
      <g>
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="54" y="48" width="12" height="18" fill="#DCCFBC"/> <!-- 뒷다리 (배경) -->
        <rect x="96" y="48" width="12" height="12" fill="#DCCFBC"/> <!-- 앞다리 (배경) -->
        <rect x="42" y="48" width="12" height="12" fill="#F7F1E8"/> <!-- 뒷다리 (전경) -->
        <rect x="84" y="48" width="12" height="18" fill="#F7F1E8"/> <!-- 앞다리 (전경) -->
      </g>
      <!-- 걸음 프레임 B: 뒤(전경)·앞(배경) 딛기 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="54" y="48" width="12" height="12" fill="#DCCFBC"/> <!-- 뒷다리 (배경) -->
        <rect x="96" y="48" width="12" height="18" fill="#DCCFBC"/> <!-- 앞다리 (배경) -->
        <rect x="42" y="48" width="12" height="18" fill="#F7F1E8"/> <!-- 뒷다리 (전경) -->
        <rect x="84" y="48" width="12" height="12" fill="#F7F1E8"/> <!-- 앞다리 (전경) -->
      </g>
    </g>
  </g>

</g>

</g>
<g id="part_play">
<g transform="translate(-18,44)">

  <!-- 분홍 뼈다귀 인형을 물고 신나게 총총 달리는 비숑 (play) / 투명 배경 / SMIL 전용 -->
  <!-- 6px 격자 기반: 모든 rect 좌표와 크기는 6의 배수, 발바닥 y=66 기준으로 그림 -->
  <!-- 0.4초 빠른 걸음, 꼬리 0.2초로 신나게, 눈웃음 -->
  <!-- 팔레트: 화이트 #F7F1E8 / 음영 #DCCFBC / 비스킷 귀 #E8D2AE / 눈코 #2B211D / 혀 #E8899A / 볼터치 #F4B9B2 -->

  <g transform="translate(0, 6)">
    <!-- 화면을 가로지르는 이동 (합성 시 제거됨) -->
    <g>
      
      <ellipse cx="90" cy="70" rx="72" ry="4" fill="#000000" opacity="0.12"/>
      <!-- 몸통 그룹: 경쾌한 들썩임 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" keyTimes="0; 0.5; 1" dur="0.4s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="42" y="24" width="54" height="6" fill="#F7F1E8"/> <!-- 둥근 등선 -->
        <rect x="36" y="30" width="66" height="12" fill="#F7F1E8"/> <!-- 포동포동한 몸통 -->
        <rect x="42" y="42" width="54" height="6" fill="#DCCFBC"/> <!-- 배 아래 솜털 음영 -->
        <rect x="102" y="36" width="6" height="12" fill="#F7F1E8"/> <!-- 앞가슴 솜털 -->
        <g>
          <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.2s" calcMode="discrete" repeatCount="indefinite"/>
          <rect x="30" y="6" width="18" height="6" fill="#F7F1E8"/> <!-- 몽글몽글 말린 깃털 꼬리 -->
          <rect x="24" y="12" width="24" height="6" fill="#F7F1E8"/>
          <rect x="30" y="18" width="12" height="6" fill="#DCCFBC"/>
          <rect x="42" y="18" width="6" height="6" fill="#F7F1E8"/>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.2s" calcMode="discrete" repeatCount="indefinite"/>
          <rect x="24" y="12" width="18" height="6" fill="#F7F1E8"/> <!-- 몽글몽글 말린 깃털 꼬리 -->
          <rect x="18" y="18" width="24" height="6" fill="#F7F1E8"/>
          <rect x="24" y="24" width="12" height="6" fill="#DCCFBC"/>
          <rect x="36" y="24" width="6" height="6" fill="#F7F1E8"/>
        </g>
        <rect x="102" y="-6" width="24" height="6" fill="#F7F1E8"/> <!-- 정수리 솜뭉치 -->
        <rect x="96" y="0" width="36" height="6" fill="#F7F1E8"/>
        <rect x="90" y="6" width="48" height="24" fill="#F7F1E8"/> <!-- 동그란 솜사탕 두상 -->
        <rect x="90" y="12" width="6" height="18" fill="#DCCFBC"/> <!-- 뒤통수 음영 (몸통과 구분) -->
        <rect x="96" y="30" width="36" height="6" fill="#DCCFBC"/> <!-- 턱 아래 솜털 음영 -->
        <rect x="138" y="12" width="12" height="12" fill="#F7F1E8"/> <!-- 짧고 보송한 주둥이 -->
        <rect x="138" y="24" width="6" height="6" fill="#F7F1E8"/> <!-- 수염 솜털 -->
        <rect x="144" y="12" width="6" height="6" fill="#2B211D"/> <!-- 까만 코 -->
        <rect x="126" y="12" width="6" height="6" fill="#B9A68C"/> <!-- 감은 눈 -->
        <rect x="126" y="24" width="6" height="6" fill="#F4B9B2"/> <!-- 볼터치 -->
        <rect x="96" y="12" width="12" height="18" fill="#E8D2AE"/> <!-- 솜털에 반쯤 묻힌 처진 귀 -->
        <rect x="102" y="30" width="6" height="6" fill="#E8D2AE"/>
        <rect x="150" y="18" width="6" height="6" fill="#F28DB2"/> <!-- 물고 있는 분홍 뼈다귀 인형 -->
        <rect x="162" y="18" width="6" height="6" fill="#F28DB2"/>
        <rect x="150" y="24" width="18" height="6" fill="#F7BCD2"/>
        <rect x="150" y="30" width="6" height="6" fill="#F28DB2"/>
        <rect x="162" y="30" width="6" height="6" fill="#F28DB2"/>
      </g>
      <!-- 걸음 프레임 A: 앞(전경)·뒤(배경) 딛기 -->
      <g>
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.4s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="54" y="48" width="12" height="18" fill="#DCCFBC"/> <!-- 뒷다리 (배경) -->
        <rect x="96" y="48" width="12" height="12" fill="#DCCFBC"/> <!-- 앞다리 (배경) -->
        <rect x="42" y="48" width="12" height="12" fill="#F7F1E8"/> <!-- 뒷다리 (전경) -->
        <rect x="84" y="48" width="12" height="18" fill="#F7F1E8"/> <!-- 앞다리 (전경) -->
      </g>
      <!-- 걸음 프레임 B: 뒤(전경)·앞(배경) 딛기 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.4s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="54" y="48" width="12" height="12" fill="#DCCFBC"/> <!-- 뒷다리 (배경) -->
        <rect x="96" y="48" width="12" height="18" fill="#DCCFBC"/> <!-- 앞다리 (배경) -->
        <rect x="42" y="48" width="12" height="18" fill="#F7F1E8"/> <!-- 뒷다리 (전경) -->
        <rect x="84" y="48" width="12" height="12" fill="#F7F1E8"/> <!-- 앞다리 (전경) -->
      </g>
    </g>
  </g>

</g>

</g>
<g id="part_react">
<g transform="translate(-378,38)">

  <!-- 신나서 제자리에서 빙글빙글 도는 비숑 (react) / 투명 배경 / SMIL 전용 -->
  <!-- 6px 격자 기반: 모든 rect 좌표와 크기는 6의 배수, 발바닥 y=66 기준으로 그림 -->
  <!-- 0.6초마다 오른쪽과 왼쪽으로 몸을 돌림 -->
  <!-- 팔레트: 화이트 #F7F1E8 / 음영 #DCCFBC / 비스킷 귀 #E8D2AE / 눈코 #2B211D / 혀 #E8899A / 볼터치 #F4B9B2 -->

  <g transform="translate(360, 12)">
    <ellipse cx="84" cy="70" rx="66" ry="4" fill="#000000" opacity="0.12"/>
    <!-- 오른쪽 보기 -->
    <g>
      <animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.25;0.75;1" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/>
      <rect x="54" y="48" width="12" height="18" fill="#DCCFBC"/> <!-- 뒷다리 (배경) -->
      <rect x="96" y="48" width="12" height="18" fill="#DCCFBC"/> <!-- 앞다리 (배경) -->
      <rect x="42" y="48" width="12" height="18" fill="#F7F1E8"/> <!-- 뒷다리 (전경) -->
      <rect x="84" y="48" width="12" height="18" fill="#F7F1E8"/> <!-- 앞다리 (전경) -->
      <rect x="42" y="24" width="54" height="6" fill="#F7F1E8"/> <!-- 둥근 등선 -->
      <rect x="36" y="30" width="66" height="12" fill="#F7F1E8"/> <!-- 포동포동한 몸통 -->
      <rect x="42" y="42" width="54" height="6" fill="#DCCFBC"/> <!-- 배 아래 솜털 음영 -->
      <rect x="102" y="36" width="6" height="12" fill="#F7F1E8"/> <!-- 앞가슴 솜털 -->
      <rect x="30" y="6" width="18" height="6" fill="#F7F1E8"/> <!-- 몽글몽글 말린 깃털 꼬리 -->
      <rect x="24" y="12" width="24" height="6" fill="#F7F1E8"/>
      <rect x="30" y="18" width="12" height="6" fill="#DCCFBC"/>
      <rect x="42" y="18" width="6" height="6" fill="#F7F1E8"/>
      <rect x="102" y="-6" width="24" height="6" fill="#F7F1E8"/> <!-- 정수리 솜뭉치 -->
      <rect x="96" y="0" width="36" height="6" fill="#F7F1E8"/>
      <rect x="90" y="6" width="48" height="24" fill="#F7F1E8"/> <!-- 동그란 솜사탕 두상 -->
      <rect x="90" y="12" width="6" height="18" fill="#DCCFBC"/> <!-- 뒤통수 음영 (몸통과 구분) -->
      <rect x="96" y="30" width="36" height="6" fill="#DCCFBC"/> <!-- 턱 아래 솜털 음영 -->
      <rect x="138" y="12" width="12" height="12" fill="#F7F1E8"/> <!-- 짧고 보송한 주둥이 -->
      <rect x="138" y="24" width="6" height="6" fill="#F7F1E8"/> <!-- 수염 솜털 -->
      <rect x="144" y="12" width="6" height="6" fill="#2B211D"/> <!-- 까만 코 -->
      <rect x="126" y="12" width="6" height="6" fill="#2B211D"/> <!-- 동그란 눈 -->
      <rect x="126" y="24" width="6" height="6" fill="#F4B9B2"/> <!-- 볼터치 -->
      <rect x="138" y="24" width="6" height="6" fill="#E8899A"/> <!-- 내민 혀 -->
      <rect x="96" y="12" width="12" height="18" fill="#E8D2AE"/> <!-- 솜털에 반쯤 묻힌 처진 귀 -->
      <rect x="102" y="30" width="6" height="6" fill="#E8D2AE"/>
    </g>
    <!-- 왼쪽 보기 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.75;1" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/>
      <rect x="102" y="48" width="12" height="18" fill="#DCCFBC"/> <!-- 뒷다리 (배경) -->
      <rect x="60" y="48" width="12" height="18" fill="#DCCFBC"/> <!-- 앞다리 (배경) -->
      <rect x="114" y="48" width="12" height="18" fill="#F7F1E8"/> <!-- 뒷다리 (전경) -->
      <rect x="72" y="48" width="12" height="18" fill="#F7F1E8"/> <!-- 앞다리 (전경) -->
      <rect x="72" y="24" width="54" height="6" fill="#F7F1E8"/> <!-- 둥근 등선 -->
      <rect x="66" y="30" width="66" height="12" fill="#F7F1E8"/> <!-- 포동포동한 몸통 -->
      <rect x="72" y="42" width="54" height="6" fill="#DCCFBC"/> <!-- 배 아래 솜털 음영 -->
      <rect x="60" y="36" width="6" height="12" fill="#F7F1E8"/> <!-- 앞가슴 솜털 -->
      <rect x="120" y="6" width="18" height="6" fill="#F7F1E8"/> <!-- 몽글몽글 말린 깃털 꼬리 -->
      <rect x="120" y="12" width="24" height="6" fill="#F7F1E8"/>
      <rect x="126" y="18" width="12" height="6" fill="#DCCFBC"/>
      <rect x="120" y="18" width="6" height="6" fill="#F7F1E8"/>
      <rect x="42" y="-6" width="24" height="6" fill="#F7F1E8"/> <!-- 정수리 솜뭉치 -->
      <rect x="36" y="0" width="36" height="6" fill="#F7F1E8"/>
      <rect x="30" y="6" width="48" height="24" fill="#F7F1E8"/> <!-- 동그란 솜사탕 두상 -->
      <rect x="72" y="12" width="6" height="18" fill="#DCCFBC"/> <!-- 뒤통수 음영 (몸통과 구분) -->
      <rect x="36" y="30" width="36" height="6" fill="#DCCFBC"/> <!-- 턱 아래 솜털 음영 -->
      <rect x="18" y="12" width="12" height="12" fill="#F7F1E8"/> <!-- 짧고 보송한 주둥이 -->
      <rect x="24" y="24" width="6" height="6" fill="#F7F1E8"/> <!-- 수염 솜털 -->
      <rect x="18" y="12" width="6" height="6" fill="#2B211D"/> <!-- 까만 코 -->
      <rect x="36" y="12" width="6" height="6" fill="#2B211D"/> <!-- 동그란 눈 -->
      <rect x="36" y="24" width="6" height="6" fill="#F4B9B2"/> <!-- 볼터치 -->
      <rect x="24" y="24" width="6" height="6" fill="#E8899A"/> <!-- 내민 혀 -->
      <rect x="60" y="12" width="12" height="18" fill="#E8D2AE"/> <!-- 솜털에 반쯤 묻힌 처진 귀 -->
      <rect x="60" y="30" width="6" height="6" fill="#E8D2AE"/>
    </g>
  </g>

</g>

</g>
</defs>
<g>
<animate attributeName="opacity" values="1;0" keyTimes="0;0.2353" dur="34s" calcMode="discrete" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="80 0; 160 -8; 160 -8" keyTimes="0; 0.2353; 1" dur="34s" repeatCount="indefinite"/>
<g><use href="#part_walk"/></g>
</g>
</g>

<g opacity="0">
<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2353;0.4118" dur="34s" calcMode="discrete" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="160 -8; 160 -8; 640 -8; 640 -8" keyTimes="0; 0.2353; 0.4118; 1" dur="34s" repeatCount="indefinite"/>
<g transform="translate(-6,0)"><use href="#part_play"/></g>
</g>
</g>

<g opacity="0">
<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4118;0.6471" dur="34s" calcMode="discrete" repeatCount="indefinite"/>
<g transform="translate(640,-8)">

<g><use href="#part_react"/></g>
</g>
</g>

<g opacity="0">
<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6471;0.8235" dur="34s" calcMode="discrete" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="640 -8; 640 -8; 160 -8; 160 -8" keyTimes="0; 0.6471; 0.8235; 1" dur="34s" repeatCount="indefinite"/>
<g transform="translate(138,0) scale(-1,1)"><use href="#part_play"/></g>
</g>
</g>

<g opacity="0">
<animate attributeName="opacity" values="0;1" keyTimes="0;0.8235" dur="34s" calcMode="discrete" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="160 -8; 160 -8; 80 0" keyTimes="0; 0.8235; 1" dur="34s" repeatCount="indefinite"/>
<g transform="translate(132,0) scale(-1,1)"><use href="#part_walk"/></g>
</g>
</g>
</svg>