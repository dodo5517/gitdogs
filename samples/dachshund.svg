<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="880" height="120">
<defs>
<g id="part_walk">
<g transform="translate(0,50)">

  <!-- Walking pixel dachshund / transparent background / SMIL only -->
  <!-- palette: brown #A0672F, dark brown #6B4423, tan #D9B285, dark #2E1F14 -->
  <g>
    <!-- whole dog walks across the banner -->
    

    <!-- ground shadow -->
    <ellipse cx="84" cy="70" rx="82" ry="4" fill="#000000" opacity="0.12"/>

    <!-- upper body: bobs in step -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 2; 0 0" keyTimes="0;0.5;1" dur="0.6s"
        calcMode="discrete" repeatCount="indefinite"/>

      <!-- tail: two wag frames -->
      <g>
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1"
          dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="0" y="12" width="12" height="6" fill="#A0672F"/>
        <rect x="6" y="18" width="12" height="6" fill="#A0672F"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1"
          dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="6" y="6" width="12" height="6" fill="#A0672F"/>
        <rect x="12" y="12" width="6" height="12" fill="#A0672F"/>
      </g>
      <!-- tail root (fixed) -->
      <rect x="12" y="24" width="6" height="6" fill="#A0672F"/>

      <!-- very long body -->
      <rect x="12" y="30" width="120" height="24" fill="#A0672F"/>
      <rect x="24" y="48" width="96"  height="6"  fill="#D9B285"/>

      <!-- head (raised, at the front) -->
      <rect x="120" y="12" width="30" height="24" fill="#A0672F"/>

      <!-- floppy ear hanging over the back of the head -->
      <rect x="120" y="18" width="12" height="18" fill="#6B4423"/>

      <!-- long snout -->
      <rect x="150" y="18" width="12" height="6" fill="#A0672F"/>
      <rect x="150" y="24" width="18" height="6" fill="#D9B285"/>
      <rect x="162" y="18" width="6"  height="6" fill="#2E1F14"/>

      <!-- eye -->
      <rect x="138" y="18" width="6" height="6" fill="#2E1F14"/>
    </g>

    <!-- stubby legs: frame A -->
    <g>
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1"
        dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
      <rect x="18"  y="54" width="12" height="6" fill="#A0672F"/>
      <rect x="18"  y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="36"  y="54" width="12" height="6" fill="#6B4423"/>
      <rect x="102" y="54" width="12" height="6" fill="#6B4423"/>
      <rect x="120" y="54" width="12" height="6" fill="#A0672F"/>
      <rect x="120" y="60" width="12" height="6" fill="#D9B285"/>
    </g>

    <!-- stubby legs: frame B -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1"
        dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
      <rect x="18"  y="54" width="12" height="6" fill="#6B4423"/>
      <rect x="36"  y="54" width="12" height="6" fill="#A0672F"/>
      <rect x="36"  y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="102" y="54" width="12" height="6" fill="#A0672F"/>
      <rect x="102" y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="120" y="54" width="12" height="6" fill="#6B4423"/>
    </g>
  </g>

</g>

</g>
<g id="part_play">
<g transform="translate(-46,50)">

  <!-- Fetch pixel dachshund with very long stick / transparent background / SMIL only -->
  <!-- 100% same character: colors, proportions, ground line -->
  <g transform="translate(46, 0)"> <!-- 캐릭터 배치 -->
    <!-- 지면 그림자 (기존과 동일) -->
    <ellipse cx="84" cy="70" rx="82" ry="4" fill="#000000" opacity="0.12"/>

    <!-- 전체 몸통 그룹: 신나서 위아래 바운스 애니메이션 -->
    <g id="dachshund_play_g_body">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 2; 0 0" keyTimes="0;0.5;1" dur="0.36s"
        calcMode="discrete" repeatCount="indefinite"/>

      <!-- 프레임 A: 신장 (갤럽Extended, opacity 애니메이션) -->
      <g id="dachshund_play_frame_a">
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1"
          dur="0.36s" calcMode="discrete" repeatCount="indefinite"/>
        
        <!-- 몸통/머리/꼬리 (신장 시) -->
        <!-- 긴 몸통 더 길게 연장: x=12, width=132 -->
        <rect x="12" y="30" width="132" height="24" fill="#A0672F"/>
        <rect x="24" y="48" width="108" height="6"  fill="#D9B285"/> <!-- 아랫배 연장 -->

        <!-- 매우 긴 막대기: 머리보다 먼저 그려 입에 물고 머리 뒤로 지나가게 함 -->
        <g id="dachshund_play_g_stick_a">
          <!-- 막대기 픽셀 (나무색 2톤) -->
          <rect x="90" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="102" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="114" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="126" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="138" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="150" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="162" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="174" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="186" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="198" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="210" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
        </g>

        <!-- 머리 (기존 위치) -->
        <rect x="120" y="12" width="30" height="24" fill="#A0672F"/>
        <rect x="138" y="18" width="6"  height="6"  fill="#2E1F14"/> <!-- 눈 -->
        
        <!-- 날리는 귀 (진갈색) -->
        <rect x="114" y="18" width="18" height="18" fill="#6B4423"/>
        
        <!-- 아랫주둥이 -->
        <rect x="150" y="24" width="18" height="6" fill="#D9B285"/>

        
        <!-- 윗주둥이 -->
        <rect x="150" y="18" width="12" height="6" fill="#A0672F"/>
        <rect x="162" y="18" width="6"  height="6" fill="#2E1F14"/> <!-- 코 -->

        <!-- 꼬리 (위로) -->
        <rect x="6" y="6" width="12" height="6" fill="#A0672F"/>
        <rect x="12" y="12" width="6" height="12" fill="#A0672F"/>
        <rect x="12" y="24" width="6" height="6" fill="#A0672F"/>

        <!-- 다리 (신장 시 앞으로/뒤로 쭉 뻗음) -->
        <!-- 앞다리 (머리 쪽) -->
        <rect x="138" y="54" width="12" height="6" fill="#A0672F"/>
        <rect x="138" y="60" width="12" height="6" fill="#D9B285"/>
        <!-- 뒷다리 (꼬리 쪽) -->
        <rect x="0" y="54" width="18" height="6" fill="#6B4423"/>
        <rect x="0"   y="60" width="12" height="6" fill="#D9B285"/>
      </g>

      <!-- 프레임 B: 수축 (갤럽Contracted, opacity 애니메이션) -->
      <g id="dachshund_play_frame_b" opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1"
          dur="0.36s" calcMode="discrete" repeatCount="indefinite"/>
        
        <!-- 몸통/머리/꼬리 (수축 시) -->
        <!-- 등이 살짝 아치: y=24, height=30으로 몸통 상단 올림 -->
        <rect x="18" y="24" width="108" height="30" fill="#A0672F"/>
        <rect x="30" y="48" width="84"  height="6"  fill="#D9B285"/> <!-- 아랫배 모음 -->

        <!-- 매우 긴 막대기: 머리보다 먼저 그려 입에 물고 머리 뒤로 지나가게 함 -->
        <g id="dachshund_play_g_stick_b">
          <!-- 막대기 픽셀 (나무색 2톤) -->
          <rect x="84" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="96" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="108" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="120" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="132" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="144" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="156" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="168" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="180" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
          <rect x="192" y="24" width="12" height="6" fill="#B08D5F"/> <!-- 밝은 쪽 -->
          <rect x="204" y="24" width="12" height="6" fill="#8B6B4A"/> <!-- 진한 쪽 -->
        </g>

        <!-- 머리 (미세하게 왼쪽 이동: x=114) -->
        <rect x="114" y="12" width="30" height="24" fill="#A0672F"/>
        <rect x="132" y="18" width="6"  height="6"  fill="#2E1F14"/> <!-- 눈 -->
        
        <!-- 날리는 귀 (진갈색) -->
        <rect x="108" y="18" width="18" height="18" fill="#6B4423"/>
        
        <!-- 아랫주둥이 (머리 이동에 맞춰 x=144) -->
        <rect x="144" y="24" width="18" height="6" fill="#D9B285"/>

        
        <!-- 윗주둥이 (머리 이동에 맞춰 x=144) -->
        <rect x="144" y="18" width="12" height="6" fill="#A0672F"/>
        <rect x="156" y="18" width="6"  height="6" fill="#2E1F14"/> <!-- 코 -->

        <!-- 꼬리 (아래로) -->
        <rect x="6" y="12" width="12" height="6" fill="#A0672F"/>
        <rect x="12" y="18" width="12" height="6" fill="#A0672F"/>
        <rect x="18" y="24" width="6" height="6" fill="#A0672F"/>

        <!-- 다리 (수축 시 몸 아래로 모음) -->
        <!-- 앞다리 (머리 쪽) -->
        <rect x="102" y="54" width="12" height="6" fill="#A0672F"/>
        <rect x="102" y="60" width="12" height="6" fill="#D9B285"/>
        <!-- 뒷다리 (꼬리 쪽) -->
        <rect x="36"  y="54" width="12" height="6" fill="#6B4423"/>
        <rect x="36"  y="60" width="12" height="6" fill="#D9B285"/>
      </g>
    </g> <!-- g_body end -->
  </g> <!-- 캐릭터 배치 g end -->

</g>

</g>
<g id="part_react">
<g transform="translate(-360,4)">

  <!-- 제 꼬리를 물려고 제자리에서 빙글빙글 도는 닥스훈트 (react) / 투명 배경 / SMIL 전용 -->
  <!-- 6px 격자, 발바닥 y=66 기준. 0.6초에 한 바퀴: 왼쪽으로 몸 말기 → 뒷모습 → 오른쪽으로 몸 말기 → 뒷모습 -->
  <!-- 색상: 브라운 #A0672F, 진갈색 #6B4423, 탠 #D9B285, 눈/코 #2E1F14 -->
  <g transform="translate(360, 46)">
    <ellipse cx="72" cy="70" rx="66" ry="4" fill="#000000" opacity="0.12"/>

    <!-- 꼬리 쪽(왼쪽)으로 몸을 만 모습 -->
    <g>
      <animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
      <rect x="54" y="54" width="12" height="6" fill="#6B4423"/> <!-- 먼 쪽 뒷다리 -->
      <rect x="108" y="54" width="12" height="6" fill="#6B4423"/> <!-- 먼 쪽 앞다리 -->
      <rect x="30" y="36" width="84" height="18" fill="#A0672F"/> <!-- 둥글게 만 긴 몸통 -->
      <rect x="36" y="48" width="72" height="6" fill="#D9B285"/> <!-- 배 -->
      <rect x="42" y="54" width="12" height="6" fill="#A0672F"/> <!-- 뒷다리 -->
      <rect x="42" y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="96" y="54" width="12" height="6" fill="#A0672F"/> <!-- 앞다리 -->
      <rect x="96" y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="96" y="24" width="18" height="12" fill="#A0672F"/> <!-- 뒤로 휘어진 목 -->
      <rect x="66" y="18" width="30" height="18" fill="#A0672F"/> <!-- 등 위로 돌린 머리 -->
      <rect x="54" y="24" width="12" height="6" fill="#A0672F"/> <!-- 주둥이 -->
      <rect x="54" y="30" width="12" height="6" fill="#D9B285"/> <!-- 아래턱 -->
      <rect x="48" y="24" width="6" height="6" fill="#2E1F14"/> <!-- 코 -->
      <rect x="72" y="24" width="6" height="6" fill="#2E1F14"/> <!-- 눈 -->
      <rect x="90" y="24" width="12" height="18" fill="#6B4423"/> <!-- 펄럭이는 귀 -->
      <rect x="18" y="30" width="18" height="6" fill="#A0672F"/> <!-- 꼬리 -->
      <rect x="30" y="24" width="18" height="6" fill="#A0672F"/> <!-- 코끝에 닿은 꼬리 끝 -->
      <rect x="132" y="60" width="6" height="6" fill="#D9B285"/> <!-- 흙먼지 -->
      <rect x="138" y="54" width="6" height="6" fill="#D9B285"/>
    </g>

    <!-- 도는 중: 뒷모습 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
      <rect x="66" y="54" width="12" height="6" fill="#6B4423"/> <!-- 먼 쪽 다리 -->
      <rect x="54" y="30" width="36" height="24" fill="#A0672F"/> <!-- 뒤에서 본 몸통 -->
      <rect x="60" y="48" width="24" height="6" fill="#D9B285"/> <!-- 배 -->
      <rect x="54" y="54" width="12" height="6" fill="#A0672F"/> <!-- 다리 -->
      <rect x="54" y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="78" y="54" width="12" height="6" fill="#A0672F"/>
      <rect x="78" y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="84" y="18" width="6" height="12" fill="#A0672F"/> <!-- 번쩍 든 꼬리 -->
      <rect x="84" y="12" width="12" height="6" fill="#A0672F"/>
      <rect x="30" y="18" width="30" height="18" fill="#A0672F"/> <!-- 옆으로 돌린 머리 -->
      <rect x="18" y="24" width="12" height="6" fill="#A0672F"/> <!-- 주둥이 -->
      <rect x="18" y="30" width="12" height="6" fill="#D9B285"/> <!-- 아래턱 -->
      <rect x="18" y="24" width="6" height="6" fill="#2E1F14"/> <!-- 코 -->
      <rect x="36" y="24" width="6" height="6" fill="#2E1F14"/> <!-- 눈 -->
      <rect x="48" y="24" width="12" height="18" fill="#6B4423"/> <!-- 귀 -->
      <rect x="6" y="60" width="6" height="6" fill="#D9B285"/> <!-- 흙먼지 -->
      <rect x="0" y="54" width="6" height="6" fill="#D9B285"/>
    </g>

    <!-- 반대쪽(오른쪽)으로 몸을 만 모습 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
      <rect x="78" y="54" width="12" height="6" fill="#6B4423"/> <!-- 먼 쪽 뒷다리 -->
      <rect x="24" y="54" width="12" height="6" fill="#6B4423"/> <!-- 먼 쪽 앞다리 -->
      <rect x="30" y="36" width="84" height="18" fill="#A0672F"/> <!-- 둥글게 만 긴 몸통 -->
      <rect x="36" y="48" width="72" height="6" fill="#D9B285"/> <!-- 배 -->
      <rect x="90" y="54" width="12" height="6" fill="#A0672F"/> <!-- 뒷다리 -->
      <rect x="90" y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="36" y="54" width="12" height="6" fill="#A0672F"/> <!-- 앞다리 -->
      <rect x="36" y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="30" y="24" width="18" height="12" fill="#A0672F"/> <!-- 뒤로 휘어진 목 -->
      <rect x="48" y="18" width="30" height="18" fill="#A0672F"/> <!-- 등 위로 돌린 머리 -->
      <rect x="78" y="24" width="12" height="6" fill="#A0672F"/> <!-- 주둥이 -->
      <rect x="78" y="30" width="12" height="6" fill="#D9B285"/> <!-- 아래턱 -->
      <rect x="90" y="24" width="6" height="6" fill="#2E1F14"/> <!-- 코 -->
      <rect x="66" y="24" width="6" height="6" fill="#2E1F14"/> <!-- 눈 -->
      <rect x="42" y="24" width="12" height="18" fill="#6B4423"/> <!-- 펄럭이는 귀 -->
      <rect x="108" y="30" width="18" height="6" fill="#A0672F"/> <!-- 꼬리 -->
      <rect x="108" y="24" width="12" height="6" fill="#A0672F"/>
      <rect x="114" y="18" width="12" height="6" fill="#A0672F"/> <!-- 도망가는 꼬리 끝 -->
      <rect x="6" y="60" width="6" height="6" fill="#D9B285"/> <!-- 흙먼지 -->
      <rect x="0" y="54" width="6" height="6" fill="#D9B285"/>
    </g>

    <!-- 도는 중: 뒷모습 (반대 방향) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
      <rect x="66" y="54" width="12" height="6" fill="#6B4423"/> <!-- 먼 쪽 다리 -->
      <rect x="54" y="30" width="36" height="24" fill="#A0672F"/> <!-- 뒤에서 본 몸통 -->
      <rect x="60" y="48" width="24" height="6" fill="#D9B285"/> <!-- 배 -->
      <rect x="78" y="54" width="12" height="6" fill="#A0672F"/> <!-- 다리 -->
      <rect x="78" y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="54" y="54" width="12" height="6" fill="#A0672F"/>
      <rect x="54" y="60" width="12" height="6" fill="#D9B285"/>
      <rect x="54" y="18" width="6" height="12" fill="#A0672F"/> <!-- 번쩍 든 꼬리 -->
      <rect x="48" y="12" width="12" height="6" fill="#A0672F"/>
      <rect x="84" y="18" width="30" height="18" fill="#A0672F"/> <!-- 옆으로 돌린 머리 -->
      <rect x="114" y="24" width="12" height="6" fill="#A0672F"/> <!-- 주둥이 -->
      <rect x="114" y="30" width="12" height="6" fill="#D9B285"/> <!-- 아래턱 -->
      <rect x="120" y="24" width="6" height="6" fill="#2E1F14"/> <!-- 코 -->
      <rect x="102" y="24" width="6" height="6" fill="#2E1F14"/> <!-- 눈 -->
      <rect x="84" y="24" width="12" height="18" fill="#6B4423"/> <!-- 귀 -->
      <rect x="132" y="60" width="6" height="6" fill="#D9B285"/> <!-- 흙먼지 -->
      <rect x="138" y="54" width="6" height="6" fill="#D9B285"/>
    </g>
  </g>

</g>

</g>
</defs>
<g>
<animate attributeName="opacity" values="1;0" keyTimes="0;0.2353" dur="34s" calcMode="discrete" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="80 0; 160 -8; 160 -8" keyTimes="0; 0.2353; 1" dur="34s" repeatCount="indefinite"/>
<g><use href="#part_walk"/></g>
</g>
</g>

<g opacity="0">
<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2353;0.4118" dur="34s" calcMode="discrete" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="160 -8; 160 -8; 640 -8; 640 -8" keyTimes="0; 0.2353; 0.4118; 1" dur="34s" repeatCount="indefinite"/>
<g><use href="#part_play"/></g>
</g>
</g>

<g opacity="0">
<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4118;0.6471" dur="34s" calcMode="discrete" repeatCount="indefinite"/>
<g transform="translate(640,-8)">

<g transform="translate(12,0)"><use href="#part_react"/></g>
</g>
</g>

